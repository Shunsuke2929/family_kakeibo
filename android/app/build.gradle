plugins {
    id("com.android.application")
}

def releaseStoreFile = findProperty("KKB_RELEASE_STORE_FILE")
def releaseStorePassword = findProperty("KKB_RELEASE_STORE_PASSWORD")
def releaseKeyAlias = findProperty("KKB_RELEASE_KEY_ALIAS")
def releaseKeyPassword = findProperty("KKB_RELEASE_KEY_PASSWORD")

android {
    namespace "YOUR_ANDROID_PACKAGE_NAME"
    compileSdk 35

    defaultConfig {
        applicationId "YOUR_ANDROID_PACKAGE_NAME"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        resValue "string", "app_name", "うちの家計簿"
        resValue "string", "launch_url", "https://YOUR_CLOUD_RUN_URL/"
        resValue "string", "fallback_type", "customtabs"
        resValue "string", "file_provider_authority", "YOUR_ANDROID_PACKAGE_NAME.fileprovider"
    }

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
